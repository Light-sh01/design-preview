<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增活动 - 食亨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: #f5f5f5;
        }
        
        /* 步骤导航 */
        .step-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 24px;
            background: white;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        
        .step-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .step-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e5e5e5;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }
        
        .step-item.active .step-num {
            background: #E31837;
            color: white;
        }
        
        .step-item.completed .step-num {
            background: #52c41a;
            color: white;
        }
        
        .step-label {
            font-size: 14px;
            color: #666;
        }
        
        .step-item.active .step-label {
            color: #E31837;
            font-weight: 500;
        }
        
        .step-divider {
            width: 60px;
            height: 2px;
            background: #e5e5e5;
        }
        
        .step-item.completed ~ .step-divider {
            background: #52c41a;
        }
        
        /* 内容区 */
        .content-card {
            background: white;
            border-radius: 8px;
            padding: 24px 32px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 24px;
        }
        
        /* 表单行 - 左右结构 */
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .form-row.align-start {
            align-items: flex-start;
        }
        
        .form-row.align-start .form-label {
            padding-top: 8px;
        }
        
        .form-label {
            width: 140px;
            font-size: 14px;
            color: #333;
            text-align: right;
            padding-right: 16px;
            flex-shrink: 0;
        }
        
        .form-label .required {
            color: #E31837;
            margin-right: 4px;
        }
        
        .form-content {
            flex: 1;
            max-width: 600px;
        }
        
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-input:hover {
            border-color: #E31837;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #E31837;
            box-shadow: 0 0 0 2px rgba(227, 24, 55, 0.1);
        }
        
        select.form-input {
            cursor: pointer;
            background-color: white;
        }
        
        .date-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .date-input {
            flex: 1;
        }
        
        /* Radio & Checkbox */
        input[type="radio"],
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #E31837;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
        }
        
        .radio-group,
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        
        .radio-item,
        .checkbox-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            line-height: 1;
        }
        
        .radio-item label,
        .checkbox-item label {
            font-size: 14px;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
            line-height: 16px;
            margin: 0;
        }
        
        /* 上传区域 */
        .upload-area {
            border: 1px dashed #d9d9d9;
            border-radius: 4px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        
        .upload-area:hover {
            border-color: #E31837;
        }
        
        .upload-area.has-image {
            padding: 8px;
            border-style: solid;
            border-color: #52c41a;
        }
        
        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
        }
        
        /* 预览区 */
        .preview-wrapper {
            background: white;
            border-radius: 8px;
            padding: 20px;
            position: sticky;
            top: 20px;
        }
        
        .preview-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .label-mock {
            border: 2px solid #d9d9d9;
            border-radius: 4px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: white;
        }
        
        .label-header {
            text-align: center;
            border-bottom: 1px dashed #333;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        
        .label-info {
            margin-bottom: 8px;
        }
        
        .label-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .label-content {
            border: 2px dashed #E31837;
            border-radius: 4px;
            padding: 12px;
            min-height: 100px;
            margin: 12px 0;
            background: #fff5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .label-content.empty {
            color: #999;
        }
        
        .label-content img {
            max-width: 100%;
            max-height: 120px;
        }
        
        .label-footer {
            text-align: center;
            border-top: 1px dashed #333;
            padding-top: 8px;
            margin-top: 8px;
            font-size: 11px;
            color: #666;
        }
        
        /* 按钮 */
        .btn {
            padding: 8px 24px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        
        .btn-primary {
            background: #E31837;
            color: white;
        }
        
        .btn-primary:hover {
            background: #c41530;
        }
        
        .btn-default {
            background: white;
            color: #333;
            border: 1px solid #d9d9d9;
        }
        
        .btn-default:hover {
            color: #E31837;
            border-color: #E31837;
        }
        
        .step-content {
            display: none;
        }
        
        .step-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-6">
        <div class="max-w-7xl mx-auto">
            <!-- 标题栏 -->
            <div class="flex items-center gap-3 mb-4">
                <button onclick="window.location.href='https://light-sh01.github.io/design-preview/'" class="text-xl text-gray-600 hover:text-gray-900">
                    ←
                </button>
                <h1 class="text-xl font-semibold text-gray-900">新增活动</h1>
            </div>

            <!-- 步骤导航 -->
            <div class="step-nav">
                <div class="step-item active">
                    <div class="step-num">1</div>
                    <div class="step-label">基础信息与生效场景</div>
                </div>
                <div class="step-divider"></div>
                <div class="step-item">
                    <div class="step-num">2</div>
                    <div class="step-label">营销内容与预览</div>
                </div>
            </div>

            <!-- 第一步 -->
            <div class="step-content active" id="step1">
                <div class="content-card">
                    <!-- 基础信息 -->
                    <div class="section-title">基础信息</div>
                    
                    <div class="form-row">
                        <div class="form-label">
                            <span class="required">*</span>活动名称：
                        </div>
                        <div class="form-content">
                            <input type="text" class="form-input" placeholder="请输入活动名称，限50个字符" maxlength="50">
                        </div>
                    </div>
                    
                    <div class="form-row align-start">
                        <div class="form-label">
                            <span class="required">*</span>优先级：
                        </div>
                        <div class="form-content">
                            <div style="display: flex; align-items: center; gap: 16px;">
                                <input type="number" class="form-input" placeholder="请输入1-999的数字" min="1" max="999" value="1" style="width: 160px;">
                                <div class="checkbox-item">
                                    <input type="checkbox" id="highest-priority">
                                    <label for="highest-priority">设为最高优先级</label>
                                </div>
                            </div>
                            <div class="text-sm text-gray-500" style="margin-top: 8px;">同时命中多个活动时的排序依据，数字越大优先级越高</div>
                        </div>
                    </div>

                    <!-- 生效场景 -->
                    <div class="section-title" style="margin-top: 40px;">生效场景</div>
                    
                    <div class="form-row">
                        <div class="form-label">
                            <span class="required">*</span>生效时间：
                        </div>
                        <div class="form-content">
                            <div class="date-group">
                                <input type="date" class="form-input date-input">
                                <span class="text-gray-400">至</span>
                                <input type="date" class="form-input date-input">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row align-start">
                        <div class="form-label">
                            <span class="required">*</span>订单类型：
                        </div>
                        <div class="form-content">
                            <div class="checkbox-group">
                                <div class="checkbox-item">
                                    <input type="checkbox" id="dine-in">
                                    <label for="dine-in">堂食</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="pickup">
                                    <label for="pickup">自提</label>
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="takeout">
                                    <label for="takeout">外卖</label>
                                </div>
                            </div>
                            <div class="text-sm text-gray-500" style="margin-top: 8px;">至少选择一种订单类型</div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-label">
                            <span class="required">*</span>适用门店：
                        </div>
                        <div class="form-content">
                            <div class="radio-group">
                                <div class="radio-item">
                                    <input type="radio" name="store" id="all-store" checked>
                                    <label for="all-store">全部</label>
                                </div>
                                <div class="radio-item">
                                    <input type="radio" name="store" id="include-store">
                                    <label for="include-store">指定门店/组织参与</label>
                                </div>
                                <div class="radio-item">
                                    <input type="radio" name="store" id="exclude-store">
                                    <label for="exclude-store">指定门店/组织不参与</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-label">
                            <span class="required">*</span>参与人群：
                        </div>
                        <div class="form-content">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <select class="form-input" id="audienceSelect" onchange="handleAudienceChange()" style="width: 200px;">
                                    <option value="all">全部</option>
                                    <option value="new">新客</option>
                                    <option value="old">老客</option>
                                    <option value="registered">注册用户</option>
                                    <option value="anonymous">匿名会员</option>
                                    <option value="card">权益卡</option>
                                    <option value="level">指定等级会员</option>
                                    <option value="wework">企微好友</option>
                                    <option value="student">学生用户</option>
                                </select>
                                
                                <!-- 权益卡二级选择 -->
                                <input type="text" id="cardSelector" class="form-input" placeholder="请选择权益卡" style="width: 300px; display: none;">
                                
                                <!-- 指定等级会员二级选择 -->
                                <input type="text" id="levelSelector" class="form-input" placeholder="请选择会员等级" style="width: 300px; display: none;">
                                
                                <!-- 说明文案 -->
                                <span id="audienceDesc" style="font-size: 13px; color: #999; display: none;"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 操作按钮 -->
                    <div style="padding-top: 24px; border-top: 1px solid #f0f0f0; display: flex; gap: 12px; margin-top: 24px;">
                        <button onclick="window.location.href='https://light-sh01.github.io/design-preview/'" class="btn btn-default">取消</button>
                        <button onclick="goToStep(2)" class="btn btn-primary">下一步</button>
                    </div>
                </div>
            </div>

            <!-- 第二步 -->
            <div class="step-content" id="step2">
                <div class="content-card">
                    <div class="section-title">营销内容</div>
                    
                    <div class="form-row align-start">
                        <div class="form-label">营销文案：</div>
                        <div class="form-content">
                            <textarea id="marketingText" class="form-input" rows="6" placeholder="请输入营销文案，最多200个字符" maxlength="200" oninput="updatePreview()"></textarea>
                            <div style="margin-top: 8px; display: flex; align-items: center; justify-content: flex-end;">
                                <span style="font-size: 13px; color: #999;">
                                    <span id="textCount">0</span>/200
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row align-start">
                        <div class="form-label">营销图片：</div>
                        <div class="form-content">
                            <div class="upload-area" id="uploadZone" onclick="document.getElementById('imageInput').click()">
                                <div id="uploadPlaceholder">
                                    <svg style="width: 48px; height: 48px; margin: 0 auto 8px; color: #999;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                    </svg>
                                    <div style="font-size: 14px; color: #666;">点击上传图片</div>
                                    <div style="font-size: 12px; color: #999; margin-top: 4px;">支持 PNG/JPG/BMP，不超过20KB</div>
                                </div>
                                <img id="imagePreview" alt="预览" style="display: none;">
                            </div>
                            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                            <button onclick="clearImage()" id="clearImageBtn" style="display: none; margin-top: 8px; color: #E31837; font-size: 13px; background: none; border: none; cursor: pointer;">
                                清除图片
                            </button>
                        </div>
                    </div>
                    
                    <!-- 操作按钮 -->
                    <div style="padding-top: 24px; border-top: 1px solid #f0f0f0; display: flex; gap: 12px; margin-top: 24px;">
                        <button onclick="goToStep(1)" class="btn btn-default">上一步</button>
                        <button class="btn btn-primary">发布</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function goToStep(step) {
            const steps = document.querySelectorAll('.step-item');
            const contents = document.querySelectorAll('.step-content');
            
            steps.forEach((s, i) => {
                if (i + 1 < step) {
                    s.classList.add('completed');
                    s.classList.remove('active');
                } else if (i + 1 === step) {
                    s.classList.add('active');
                    s.classList.remove('completed');
                } else {
                    s.classList.remove('active', 'completed');
                }
            });
            
            contents.forEach((c, i) => {
                if (i + 1 === step) {
                    c.classList.add('active');
                } else {
                    c.classList.remove('active');
                }
            });
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function handleAudienceChange() {
            const select = document.getElementById('audienceSelect');
            const value = select.value;
            
            // 隐藏所有二级选择器
            document.getElementById('cardSelector').style.display = 'none';
            document.getElementById('levelSelector').style.display = 'none';
            
            const descDiv = document.getElementById('audienceDesc');
            descDiv.style.display = 'none';
            descDiv.innerHTML = '';
            
            // 根据选择显示对应的二级选择器或说明
            if (value === 'card') {
                document.getElementById('cardSelector').style.display = 'block';
            } else if (value === 'level') {
                document.getElementById('levelSelector').style.display = 'block';
            } else if (value === 'wework') {
                descDiv.innerHTML = '企微好友：已经添加品牌客服为好友的客户';
                descDiv.style.display = 'block';
            } else if (value === 'student') {
                descDiv.innerHTML = '学生用户：成功认证大学生身份的用户';
                descDiv.style.display = 'block';
            }
        }
        
        function updatePreview() {
            const text = document.getElementById('marketingText').value;
            const count = document.getElementById('textCount');
            count.textContent = text.length;
        }
        
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                // 校验文件大小（20KB = 20 * 1024 字节）
                const maxSize = 20 * 1024;
                if (file.size > maxSize) {
                    alert('图片大小不能超过20KB，请重新选择！');
                    e.target.value = '';
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = document.getElementById('imagePreview');
                    const zone = document.getElementById('uploadZone');
                    const placeholder = document.getElementById('uploadPlaceholder');
                    const btn = document.getElementById('clearImageBtn');
                    
                    img.src = ev.target.result;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                    zone.classList.add('has-image');
                    btn.style.display = 'block';
                    
                    document.getElementById('marketingText').value = '';
                    document.getElementById('textCount').textContent = '0';
                };
                reader.readAsDataURL(file);
            }
        }
        
        function clearImage() {
            const img = document.getElementById('imagePreview');
            const zone = document.getElementById('uploadZone');
            const placeholder = document.getElementById('uploadPlaceholder');
            const btn = document.getElementById('clearImageBtn');
            const input = document.getElementById('imageInput');
            
            img.src = '';
            img.style.display = 'none';
            placeholder.style.display = 'block';
            zone.classList.remove('has-image');
            btn.style.display = 'none';
            input.value = '';
        }
    </script>
</body>
</html>
