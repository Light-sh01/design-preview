<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作记录 - 食亨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: #f5f5f5;
        }
        
        .table-row:hover {
            background: #FAFAFA;
            transition: background 0.2s;
        }
        
        .action-link {
            color: #1890FF;
            cursor: pointer;
            font-size: 14px;
            margin-right: 12px;
        }
        
        .action-link:hover {
            color: #E31837;
        }
        
        .type-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .type-create {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .type-edit {
            background: #e3f2fd;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-6">
        <div class="max-w-7xl mx-auto">
            <!-- 标题栏 -->
            <div class="flex items-center gap-3 mb-4">
                <button onclick="window.history.back()" class="text-xl text-gray-600 hover:text-gray-900">
                    ←
                </button>
                <h1 class="text-xl font-semibold text-gray-900">操作记录</h1>
            </div>
            
            <!-- 活动信息 -->
            <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
                <div class="flex items-center gap-4">
                    <span class="text-sm text-gray-500">活动名称：</span>
                    <span class="text-sm font-medium text-gray-900">春节新客福利</span>
                    <span class="text-sm text-gray-500">活动ID：</span>
                    <span class="text-sm font-mono text-gray-900">ACT202601001</span>
                </div>
            </div>

            <!-- 操作记录表格 -->
            <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作账号</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作时间</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作类型</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作内容</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作后</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <!-- 记录1：修改活动内容+状态（最新） -->
                        <tr class="table-row">
                            <td class="px-4 py-4">
                                <div class="text-sm text-gray-900">张三</div>
                                <div class="text-sm text-gray-500">13800138000</div>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-900">2026-01-25 14:30:25</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="type-badge type-edit">修改</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-900">活动内容、活动状态</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="action-link" onclick="window.location.href='https://light-sh01.github.io/design-preview/create.html'">查看详情</span>
                                <span class="text-sm text-gray-600">状态修改为「进行中」</span>
                            </td>
                        </tr>

                        <!-- 记录2：仅修改活动内容 -->
                        <tr class="table-row">
                            <td class="px-4 py-4">
                                <div class="text-sm text-gray-900">李四</div>
                                <div class="text-sm text-gray-500">13900139000</div>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-900">2026-01-22 10:15:08</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="type-badge type-edit">修改</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-900">活动内容</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="action-link" onclick="window.location.href='https://light-sh01.github.io/design-preview/create.html'">查看详情</span>
                            </td>
                        </tr>

                        <!-- 记录3：仅修改活动状态 -->
                        <tr class="table-row">
                            <td class="px-4 py-4">
                                <div class="text-sm text-gray-900">王五</div>
                                <div class="text-sm text-gray-500">13700137000</div>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-900">2026-01-21 16:45:30</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="type-badge type-edit">修改</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-900">活动状态</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-600">状态修改为「待发布」</span>
                            </td>
                        </tr>

                        <!-- 记录4：新建活动（最早的记录，放在最后） -->
                        <tr class="table-row">
                            <td class="px-4 py-4">
                                <div class="text-sm text-gray-900">张三</div>
                                <div class="text-sm text-gray-500">13800138000</div>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-900">2026-01-20 09:00:00</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="type-badge type-create">新建</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="text-sm text-gray-900">活动内容</span>
                            </td>
                            <td class="px-4 py-4">
                                <span class="action-link" onclick="window.location.href='https://light-sh01.github.io/design-preview/create.html'">查看详情</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
